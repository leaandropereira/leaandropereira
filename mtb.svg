<defs><clipPath id="c"><rect width="480" height="130" rx="12"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a14"/><stop offset="1" stop-color="#10261d"/></linearGradient></defs>
<style>
.far{fill:#153326;animation:scroll 24s linear infinite}
.mid{fill:#1b4232;animation:scroll 12s linear infinite}
.near{animation:scroll 4s linear infinite}
@keyframes scroll{to{transform:translateX(-480px)}}
.tire{fill:none;stroke:#cfe8dc;stroke-width:3}
.rim{fill:none;stroke:#3fae7c;stroke-width:1}
.spin{stroke:#7fbfa2;stroke-width:.8;animation:spin .42s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.frame{fill:none;stroke:#ff7a2f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.leg{fill:none;stroke:#e6f4ec;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.legfar{fill:none;stroke:#8fb3a3;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.body{fill:none;stroke:#5eead4;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.arm{fill:none;stroke:#e6f4ec;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.crank{stroke:#cfe8dc;stroke-width:2;fill:none}
.bob{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(1.2px)}}
.dust{fill:#6b5b2a;opacity:0;animation:dust .9s ease-out infinite}
@keyframes dust{0%{opacity:.7;transform:translate(0,0)}100%{opacity:0;transform:translate(-26px,-6px)}}
</style>
